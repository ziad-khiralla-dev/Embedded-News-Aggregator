name: Auto Fetch Embedded News

# Set workflow schedule
on:
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours
  workflow_dispatch: # Allow manual trigger

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    # Permissions to write in the repository
    permissions:
      contents: write

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4

      # 4. Run Fetcher Script
      - name: Run Fetcher Script
        run: python main.py

      # 5. Commit and push changes if any
      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_links.json
          git diff --staged --quiet || git commit -m "Auto-update seen_links.json with latest embedded news [skip ci]"
          git push